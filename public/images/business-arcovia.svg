<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bridge structure over blueprint grid — abstract infrastructure scene">
  <defs>
    <linearGradient id="arSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDE3E6"/>
      <stop offset="100%" stop-color="#B9C2C9"/>
    </linearGradient>
    <linearGradient id="arSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7480"/>
      <stop offset="100%" stop-color="#3D4550"/>
    </linearGradient>
    <pattern id="arGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#3A4A63" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#arSky)"/>
  <rect y="620" width="1600" height="380" fill="#8FA0B5" opacity="0.5"/>
  <rect y="620" width="1600" height="380" fill="url(#arGrid)"/>

  <rect x="140" y="300" width="60" height="700" fill="url(#arSteel)"/>
  <rect x="1400" y="300" width="60" height="700" fill="url(#arSteel)"/>

  <path d="M140 340 C 500 520 1100 520 1460 340" fill="none" stroke="url(#arSteel)" stroke-width="26" stroke-linecap="round"/>
  <path d="M170 340 C 520 500 1080 500 1430 340" fill="none" stroke="#2E3540" stroke-width="4" opacity="0.5"/>

  <rect x="140" y="560" width="1320" height="26" fill="url(#arSteel)"/>
  <rect x="140" y="600" width="1320" height="10" fill="#2E3540" opacity="0.4"/>

  <g stroke="url(#arSteel)" stroke-width="8" opacity="0.9">
    <line x1="320" y1="404" x2="320" y2="560"/>
    <line x1="520" y1="452" x2="520" y2="560"/>
    <line x1="720" y1="478" x2="720" y2="560"/>
    <line x1="880" y1="478" x2="880" y2="560"/>
    <line x1="1080" y1="452" x2="1080" y2="560"/>
    <line x1="1280" y1="404" x2="1280" y2="560"/>
  </g>

  <g fill="#2E3540" opacity="0.55">
    <circle cx="320" cy="404" r="9"/>
    <circle cx="520" cy="452" r="9"/>
    <circle cx="720" cy="478" r="9"/>
    <circle cx="880" cy="478" r="9"/>
    <circle cx="1080" cy="452" r="9"/>
    <circle cx="1280" cy="404" r="9"/>
  </g>
</svg>
