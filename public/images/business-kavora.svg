<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Golden wheat fields at dawn — abstract landscape">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5EFDF"/>
      <stop offset="55%" stop-color="#EAE0C3"/>
      <stop offset="100%" stop-color="#D9C79A"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A8B5C"/>
      <stop offset="100%" stop-color="#6E7A4F"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5F7048"/>
      <stop offset="100%" stop-color="#49573A"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D4A31"/>
      <stop offset="100%" stop-color="#2C3626"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
