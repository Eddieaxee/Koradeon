<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Parametric architectural monolith in warm light — abstract group hero">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4EFE4"/>
      <stop offset="55%" stop-color="#E8DFCC"/>
      <stop offset="100%" stop-color="#D8CBB2"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57503F"/>
      <stop offset="100%" stop-color="#2A2620"/>
    </linearGradient>
    <linearGradient id="monoLite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9BFA9"/>
      <stop offset="100%" stop-color="#A79C82"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E9D3A0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E9D3A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#heroBg)"/>
  <ellipse cx="800" cy="360" rx="620" ry="420" fill="url(#glow)"/>

  <g opacity="0.35" stroke="#8B8168" stroke-width="1">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
  </g>

  <g>
    <rect x="640" y="180" width="320" height="640" rx="6" fill="url(#mono)"/>
    <rect x="560" y="260" width="80" height="560" rx="4" fill="url(#monoLite)" opacity="0.85"/>
    <rect x="960" y="260" width="80" height="560" rx="4" fill="url(#monoLite)" opacity="0.85"/>
    <rect x="712" y="252" width="176" height="176" rx="4" fill="#E7D4A4" opacity="0.92"/>
    <rect x="712" y="470" width="176" height="8" rx="4" fill="#C9BFA9"/>
    <rect x="712" y="508" width="120" height="8" rx="4" fill="#8B8168"/>
  </g>

  <ellipse cx="800" cy="856" rx="330" ry="34" fill="#3A342A" opacity="0.22"/>
</svg>
